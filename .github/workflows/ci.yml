name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toktickit?schema=public
  VITE_API_URL: http://localhost:3001

jobs:
  checks:
    name: Lint, build, client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server prisma:generate
      - run: pnpm exec oxlint --deny-warnings --format=github
      - run: pnpm exec oxfmt --check
      - run: pnpm --filter server build
      - run: pnpm --filter client build
      - run: pnpm --filter client test --reporter=default --reporter=json --outputFile.json=client-test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-results
          path: client/client-test-results.json
          if-no-files-found: ignore
          retention-days: 1

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server prisma:generate
      - run: pnpm --filter server exec prisma migrate deploy
      - run: pnpm --filter server prisma:seed
      - run: pnpm --filter server test --reporter=default --reporter=json --outputFile.json=server-test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: server/server-test-results.json
          if-no-files-found: ignore
          retention-days: 1

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server prisma:generate
      - run: pnpm --filter server exec prisma migrate deploy
      - run: pnpm --filter server prisma:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-test-results.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: e2e-test-results.json
          if-no-files-found: ignore
          retention-days: 1
